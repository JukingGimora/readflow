<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>readflow · 业务系统只读 Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%234f46e5'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 21c4 0 3-10 7-10s3 10 7 10' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --ink: #0f172a;
  --ink-2: #475569;
  --ink-3: #94a3b8;
  --line: #e5e9f2;
  --line-2: #eef1f7;
  --brand: #4f46e5;
  --brand-2: #06b6d4;
  --brand-3: #8b5cf6;
  --brand-soft: #eef2ff;
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --err: #dc2626;
  --err-soft: #fef2f2;
  --grad: linear-gradient(135deg, #4f46e5 0%, #7c3aed 45%, #06b6d4 100%);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 1px rgba(15, 23, 42, .03);
  --shadow: 0 6px 24px -8px rgba(30, 41, 99, .14), 0 2px 6px rgba(15, 23, 42, .04);
  --shadow-lg: 0 24px 60px -20px rgba(30, 41, 99, .28), 0 8px 20px -8px rgba(15, 23, 42, .08);
  --r: 16px;
  --side: 268px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent; overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* 背景：缓慢流动的浅色光晕 */
.aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; animation: drift 26s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 520px; height: 520px; left: 18%; top: -180px; background: #c7d2fe; }
.aurora i:nth-child(2) { width: 460px; height: 460px; right: -120px; top: 12%; background: #a5f3fc; animation-duration: 32s; animation-delay: -8s; }
.aurora i:nth-child(3) { width: 420px; height: 420px; left: 42%; bottom: -220px; background: #ddd6fe; animation-duration: 38s; animation-delay: -16s; }
@keyframes drift { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(60px, 40px, 0) scale(1.15); } }

.app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--side) minmax(0, 1fr); height: 100dvh; }

/* 侧栏 */
.side { display: flex; flex-direction: column; gap: 22px; padding: 20px 16px; border-right: 1px solid var(--line); background: rgba(255, 255, 255, .66); backdrop-filter: blur(18px); overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 11px; padding: 2px 6px; }
.logo { width: 34px; height: 34px; border-radius: 11px; background: var(--grad); background-size: 180% 180%; display: grid; place-items: center; box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .6); animation: sheen 9s ease-in-out infinite alternate; flex: none; }
.logo svg { width: 20px; height: 20px; }
@keyframes sheen { from { background-position: 0% 0%; } to { background-position: 100% 100%; } }
.brand b { display: block; font-size: 16px; letter-spacing: .2px; line-height: 1.2; }
.brand small { color: var(--ink-3); font-size: 11.5px; }
.nav { display: grid; gap: 4px; }
.nav button { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; color: var(--ink-2); font-weight: 500; text-align: left; transition: background .18s, color .18s, transform .18s; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: rgba(79, 70, 229, .06); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--line); }
.side h6 { margin: 0 0 8px; padding: 0 8px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .6px; }
.sys-list { display: grid; gap: 8px; }
.sys { display: grid; gap: 6px; padding: 12px; border-radius: 13px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); transition: transform .2s, box-shadow .2s; }
.sys:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.sys-top { display: flex; align-items: center; gap: 9px; }
.sys-ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--brand); background: var(--brand-soft); flex: none; }
.sys-name { font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-host { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.btn-ghost { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 9px 12px; border-radius: 11px; border: 1px dashed #cbd5e1; color: var(--ink-2); font-weight: 500; transition: border-color .18s, color .18s, background .18s; }
.btn-ghost:hover { border-color: var(--brand); color: var(--brand); background: rgba(79, 70, 229, .04); }
.btn-ghost svg { width: 16px; height: 16px; }
.side-foot { margin-top: auto; padding: 12px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); display: grid; gap: 4px; }
.live { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.ok { background: #10b981; box-shadow: 0 0 0 0 rgba(16, 185, 129, .5); animation: ping 2.4s ease-out infinite; }
.dot.err { background: var(--err); }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, .45); } 100% { box-shadow: 0 0 0 9px rgba(16, 185, 129, 0); } }

/* 胶囊 */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; line-height: 1.7; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: #a7f3d0; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: #fde68a; }
.pill.err { background: var(--err-soft); color: var(--err); border-color: #fecaca; }
.pill.brand { background: var(--brand-soft); color: var(--brand); border-color: #c7d2fe; }
.pill svg { width: 12px; height: 12px; }

/* 主区 */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding: 16px 28px 8px; }
.top h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: .2px; }
.top p { margin: 0; color: var(--ink-3); font-size: 12.5px; }
.top .grow { flex: 1; min-width: 0; }
.top .m-brand { display: none; }
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-sm); font-weight: 500; color: var(--ink-2); transition: transform .16s, box-shadow .16s, color .16s, border-color .16s; white-space: nowrap; }
.btn:hover { transform: translateY(-1px); box-shadow: var(--shadow); color: var(--ink); }
.btn:active { transform: translateY(0); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--grad); background-size: 160% 160%; color: #fff; border-color: transparent; box-shadow: 0 8px 20px -8px rgba(79, 70, 229, .7); }
.btn.primary:hover { color: #fff; background-position: 100% 50%; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.view { display: none; flex: 1; min-height: 0; flex-direction: column; }
.view.active { display: flex; animation: viewIn .35s cubic-bezier(.2, .8, .2, 1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* 会话 */
.thread { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 28px 24px; }
.thread-inner { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.hero { display: grid; justify-items: center; text-align: center; gap: 14px; padding: 4vh 0 8px; }
.hero h2 { margin: 6px 0 0; font-size: clamp(22px, 3vw, 30px); font-weight: 680; letter-spacing: .3px; }
.hero h2 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--ink-2); max-width: 520px; }

/* 语音球 */
.orb { position: relative; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; transition: transform .3s cubic-bezier(.2, .8, .2, 1); }
.orb:hover { transform: scale(1.04); }
.orb:active { transform: scale(.97); }
.orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
.orb::before { background: conic-gradient(from 0deg, #818cf8, #22d3ee, #a78bfa, #f0abfc, #818cf8); filter: blur(14px); opacity: .6; animation: spin 9s linear infinite; }
.orb::after { inset: 9px; background: radial-gradient(circle at 32% 28%, #fff 0%, #eef2ff 30%, #c7d2fe 62%, #a5b4fc 100%); box-shadow: inset 0 -10px 24px rgba(79, 70, 229, .28), inset 0 6px 14px rgba(255, 255, 255, .9), 0 14px 34px -12px rgba(79, 70, 229, .55); animation: breathe 4.2s ease-in-out infinite; }
.orb svg { position: relative; z-index: 2; width: 34px; height: 34px; color: var(--brand); transition: transform .25s; }
.orb .ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(99, 102, 241, .45); opacity: 0; }
.orb.listening .ring { animation: ripple 1.8s ease-out infinite; }
.orb.listening .ring:nth-of-type(2) { animation-delay: .6s; }
.orb.listening .ring:nth-of-type(3) { animation-delay: 1.2s; }
.orb.listening::before { animation-duration: 2.4s; opacity: .9; }
.orb.listening::after { animation-duration: 1.1s; }
.orb.thinking::before { animation-duration: 1.4s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.045); } }
@keyframes ripple { 0% { transform: scale(.9); opacity: .7; } 100% { transform: scale(1.75); opacity: 0; } }
.orb-hint { font-size: 12.5px; color: var(--ink-3); min-height: 20px; }

.caps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; width: 100%; margin-top: 10px; text-align: left; }
.cap { display: grid; gap: 4px; padding: 13px 14px; border-radius: 14px; background: rgba(255, 255, 255, .82); border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; transition: transform .22s cubic-bezier(.2, .8, .2, 1), box-shadow .22s, border-color .22s; animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
.cap:hover { transform: translateY(-3px); box-shadow: var(--shadow); border-color: #c7d2fe; }
.cap span { font-size: 11.5px; color: var(--brand); font-weight: 600; }
.cap b { font-weight: 550; font-size: 13.5px; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.msg { display: flex; gap: 12px; animation: rise .4s cubic-bezier(.2, .8, .2, 1) both; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { max-width: 78%; padding: 10px 15px; border-radius: 18px 18px 5px 18px; background: var(--grad); color: #fff; box-shadow: 0 8px 20px -10px rgba(79, 70, 229, .7); white-space: pre-wrap; word-break: break-word; }
.avatar { width: 32px; height: 32px; border-radius: 50%; flex: none; margin-top: 2px; background: conic-gradient(from 120deg, #818cf8, #22d3ee, #a78bfa, #818cf8); box-shadow: inset 0 0 0 3px #fff, 0 4px 12px -4px rgba(79, 70, 229, .5); }
.avatar.busy { animation: spin 1.6s linear infinite; }
.card { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 5px 18px 18px 18px; box-shadow: var(--shadow); overflow: hidden; }
.card-body { padding: 14px 16px 6px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }

/* 执行路径 */
.trace { display: flex; align-items: stretch; gap: 0; padding: 11px 14px; background: linear-gradient(180deg, #fafbff, #f6f8ff); border-bottom: 1px solid var(--line-2); overflow-x: auto; scrollbar-width: none; }
.trace::-webkit-scrollbar { display: none; }
.step { display: flex; align-items: center; gap: 8px; flex: none; opacity: .32; transform: translateY(2px); transition: opacity .35s, transform .35s; }
.step.on { opacity: 1; transform: none; }
.step i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: #e2e8f0; color: #fff; flex: none; transition: background .35s, box-shadow .35s; }
.step.on i { background: var(--brand); box-shadow: 0 0 0 4px rgba(79, 70, 229, .12); }
.step.on.safe i { background: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, .14); }
.step i svg { width: 12px; height: 12px; }
.step small { display: block; font-size: 10.5px; color: var(--ink-3); line-height: 1.2; }
.step b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; white-space: nowrap; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
.link { flex: 1 0 18px; min-width: 18px; max-width: 56px; align-self: center; height: 2px; margin: 0 9px; border-radius: 2px; background: #e2e8f0; position: relative; overflow: hidden; }
.link::after { content: ""; position: absolute; inset: 0; background: var(--grad); transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
.link.on::after { transform: scaleX(1); }
.thinking-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; color: var(--ink-2); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); animation: bounce 1.1s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .15s; }
.dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-5px); opacity: 1; } }

.reply { margin: 0; font-size: 14.5px; line-height: 1.75; word-break: break-word; }
.reply.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more { color: var(--brand); font-weight: 500; font-size: 12.5px; justify-self: start; }
.more:hover { text-decoration: underline; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
.kpi { padding: 11px 13px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--line-2); }
.kpi small { display: block; color: var(--ink-3); font-size: 11.5px; }
.kpi b { font-size: 20px; font-weight: 680; letter-spacing: -.2px; line-height: 1.35; }
.kpi b .unit { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 3px; }
.kpi.accent { background: linear-gradient(135deg, #eef2ff, #ecfeff); border-color: #dbe4ff; }
.kpi.accent b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kpi.accent b .unit { -webkit-text-fill-color: var(--ink-3); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(64px, 120px) 1fr auto; align-items: center; gap: 10px; font-size: 12.5px; }
.bar label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bar .track { height: 8px; border-radius: 8px; background: var(--line-2); overflow: hidden; }
.bar .fill { height: 100%; width: 0; border-radius: 8px; background: var(--grad); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.bar output { color: var(--ink-2); white-space: nowrap; }
.table-wrap { border: 1px solid var(--line-2); border-radius: 12px; overflow: auto; max-height: 340px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line-2); }
th { position: sticky; top: 0; background: #f8fafc; color: var(--ink-3); font-weight: 600; font-size: 11.5px; z-index: 1; }
td.r, th.r { text-align: right; }
tbody tr { transition: background .15s; }
tbody tr:hover { background: #f8faff; }
tbody tr:last-child td { border-bottom: 0; }
.detail { border-top: 1px dashed var(--line); padding: 10px 16px; font-size: 12.5px; color: var(--ink-2); background: #fcfcff; }
.detail ol { margin: 4px 0 6px; padding-left: 20px; }
.detail .fb { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px 12px 16px; }
.card-foot .grow { flex: 1; }
.icon-btn { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-3); transition: background .15s, color .15s; }
.icon-btn:hover { background: var(--brand-soft); color: var(--brand); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding-left: 44px; animation: rise .45s .25s cubic-bezier(.2, .8, .2, 1) both; }
.chip { padding: 6px 13px; border-radius: 999px; background: rgba(255, 255, 255, .85); border: 1px solid #c7d2fe; color: var(--brand); font-weight: 500; font-size: 13px; transition: transform .18s, background .18s, box-shadow .18s; }
.chip:hover { transform: translateY(-2px); background: var(--brand-soft); box-shadow: var(--shadow-sm); }
.chips small { align-self: center; color: var(--ink-3); font-size: 12px; }

/* 输入区 */
.composer-wrap { padding: 0 28px calc(16px + env(safe-area-inset-bottom)); }
.composer { max-width: 860px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px; padding: 8px; border-radius: 22px; background: rgba(255, 255, 255, .92); border: 1px solid var(--line); box-shadow: var(--shadow-lg); backdrop-filter: blur(14px); transition: border-color .2s, box-shadow .2s; }
.composer:focus-within { border-color: #a5b4fc; box-shadow: var(--shadow-lg), 0 0 0 4px rgba(99, 102, 241, .12); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: none; padding: 9px 6px; max-height: 132px; line-height: 1.5; font-size: 15px; }
.composer textarea::placeholder { color: var(--ink-3); }
.mic { position: relative; width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--brand); background: radial-gradient(circle at 30% 25%, #fff, #e0e7ff 70%, #c7d2fe); box-shadow: inset 0 -3px 8px rgba(79, 70, 229, .2), 0 4px 12px -4px rgba(79, 70, 229, .5); transition: transform .2s; }
.mic:hover { transform: scale(1.06); }
.mic svg { width: 19px; height: 19px; }
.mic.listening { color: #fff; background: var(--grad); animation: breathe 1.1s ease-in-out infinite; }
.mic.listening::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid rgba(99, 102, 241, .5); animation: ripple 1.5s ease-out infinite; }
.send { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; background: var(--grad); box-shadow: 0 6px 16px -6px rgba(79, 70, 229, .7); transition: transform .2s, opacity .2s; }
.send:hover { transform: translateY(-1px) scale(1.04); }
.send[disabled] { opacity: .35; pointer-events: none; }
.send svg { width: 18px; height: 18px; }
.composer-note { max-width: 860px; margin: 7px auto 0; display: flex; justify-content: center; gap: 14px; font-size: 11.5px; color: var(--ink-3); }
.composer-note span { display: inline-flex; align-items: center; gap: 4px; }
.composer-note svg { width: 12px; height: 12px; }

/* 图谱 */
.page { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 28px 28px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.legend .pill i, .node i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, #94a3b8); flex: none; }
.graph-card { position: relative; display: flex; background: rgba(255, 255, 255, .88); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
.graph-scroll { flex: 1; min-width: 0; overflow: auto; height: min(68vh, 720px); background-image: radial-gradient(#dfe5f1 1px, transparent 1px); background-size: 22px 22px; }
.stage { position: relative; transform-origin: 0 0; }
.stage svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: #cbd5e1; stroke-width: 1.5; transition: stroke .2s, opacity .2s, stroke-width .2s; }
.edge.implicit { stroke-dasharray: 4 5; opacity: 0; }
.stage.focus .edge { opacity: .14; }
.stage.focus .edge.hl { opacity: 1; stroke: var(--brand); stroke-width: 2; stroke-dasharray: 6 6; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.col-title { position: absolute; top: 14px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .5px; text-align: center; }
.node { position: absolute; display: flex; align-items: center; gap: 9px; padding: 0 12px; border-radius: 13px; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-sm); text-align: left; transition: transform .2s cubic-bezier(.2, .8, .2, 1), box-shadow .2s, border-color .2s, opacity .2s; animation: pop .45s cubic-bezier(.2, .9, .3, 1.2) both; }
.node:hover, .node.sel { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--c, var(--brand)); }
.node.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, #4f46e5) 18%, transparent), var(--shadow); }
.node div { min-width: 0; }
.node b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node small { display: block; font-size: 10.5px; color: var(--ink-3); line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.node .order { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 6px rgba(79, 70, 229, .5); }
.node.off { border-style: dashed; }
.node.off b { color: var(--ink-3); }
.stage.focus .node:not(.hl) { opacity: .28; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.zoom { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: rgba(255, 255, 255, .92); border: 1px solid var(--line); box-shadow: var(--shadow-sm); }
.inspector { flex: none; width: 0; height: min(68vh, 720px); background: rgba(255, 255, 255, .97); overflow: hidden auto; transition: width .32s cubic-bezier(.2, .8, .2, 1); }
.inspector > * { width: 302px; margin-left: 14px; }
.inspector > :first-child { margin-top: 14px; }
.inspector > :last-child { margin-bottom: 14px; }
.inspector.open { width: 330px; border-left: 1px solid var(--line); }
.inspector header { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.inspector h3 { margin: 4px 0 0; font-size: 15px; flex: 1; word-break: break-word; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; font-size: 12.5px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-word; }
.kv code, .mono { font-family: var(--mono); font-size: 11.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.chain { display: grid; gap: 6px; }
.chain div { display: flex; align-items: center; gap: 8px; }
.chain .n { width: 18px; height: 18px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none; }
.empty { padding: 60px 20px; text-align: center; color: var(--ink-3); }

/* 护栏 */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; max-width: 1100px; }
.panel { min-width: 0; background: rgba(255, 255, 255, .9); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); padding: 16px 18px; }
.panel.wide { grid-column: 1 / -1; }
.panel h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.panel h3 svg { width: 17px; height: 17px; color: var(--brand); }
.panel ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.panel li { display: flex; gap: 9px; align-items: flex-start; color: var(--ink-2); font-size: 13px; }
.panel li svg { width: 15px; height: 15px; margin-top: 3px; flex: none; color: #10b981; }
.guard-hero { display: flex; align-items: center; gap: 16px; }
.shield { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); flex: none; }
.shield.warn { background: var(--warn-soft); color: var(--warn); }
.shield svg { width: 26px; height: 26px; }
.guard-hero b { font-size: 16px; }
.guard-hero p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; }

/* 弹层 */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(15, 23, 42, .28); backdrop-filter: blur(6px); animation: fade .2s ease both; }
.sheet { width: min(640px, 100%); max-height: calc(100dvh - 40px); overflow: auto; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-lg); padding: 20px 22px; animation: sheetIn .32s cubic-bezier(.2, .9, .3, 1.1) both; }
.sheet h3 { margin: 0 0 4px; font-size: 17px; }
.sheet p { margin: 0 0 14px; color: var(--ink-2); font-size: 13px; }
.drop { display: grid; place-items: center; gap: 6px; padding: 18px; border: 1.5px dashed #c7d2fe; border-radius: 14px; background: #fafbff; color: var(--ink-2); text-align: center; transition: background .2s, border-color .2s; }
.drop.over { background: var(--brand-soft); border-color: var(--brand); }
.drop u { color: var(--brand); cursor: pointer; text-decoration: none; font-weight: 500; }
.sheet textarea { width: 100%; height: 180px; margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; resize: vertical; font: 12px/1.55 var(--mono); background: var(--surface-2); outline: 0; }
.sheet textarea:focus { border-color: #a5b4fc; box-shadow: 0 0 0 4px rgba(99, 102, 241, .12); }
.check { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 12.5px; display: grid; gap: 6px; }
.check.ok { background: var(--ok-soft); color: #065f46; }
.check.err { background: var(--err-soft); color: #991b1b; }
.check.warn { background: var(--warn-soft); color: #92400e; }
.sheet footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetIn { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: none; } }
.toasts { position: fixed; z-index: 60; top: 16px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(92vw, 520px); }
.toast { padding: 9px 15px; border-radius: 12px; background: #0f172a; color: #fff; font-size: 13px; box-shadow: var(--shadow-lg); animation: toastIn .3s cubic-bezier(.2, .9, .3, 1.2) both; }
.toast.err { background: #b91c1c; }
.toast.ok { background: #047857; }
.toast.out { opacity: 0; transform: translateY(-8px); transition: all .25s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px) scale(.96); } to { opacity: 1; transform: none; } }

.tabbar { display: none; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .side { display: none; }
  .top { padding: 12px 16px 6px; }
  .top .m-brand { display: grid; }
  .top p { display: none; }
  .thread, .page { padding-left: 14px; padding-right: 14px; }
  .composer-wrap { padding: 0 12px 8px; }
  .composer-note { display: none; }
  .hero { padding-top: 2vh; }
  .orb { width: 112px; height: 112px; }
  .caps { grid-template-columns: 1fr 1fr; }
  .msg.user .bubble { max-width: 88%; }
  .chips { padding-left: 0; }
  .avatar { display: none; }
  .card { border-radius: 16px; }
  .graph-scroll { height: 62vh; }
  .inspector, .inspector.open { position: absolute; left: 8px; right: 8px; bottom: 8px; width: auto; height: auto; max-height: 62%; border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow-lg); transform: translateY(calc(100% + 20px)); transition: transform .32s cubic-bezier(.2, .8, .2, 1); }
  .inspector.open { transform: none; }
  .inspector > * { width: auto; margin-right: 14px; }
  .tabbar { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); background: rgba(255, 255, 255, .92); backdrop-filter: blur(14px); padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); }
  .tabbar button { display: grid; justify-items: center; gap: 1px; padding: 6px 4px; border-radius: 12px; font-size: 11px; color: var(--ink-3); font-weight: 500; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button[aria-current="page"] { color: var(--brand); }
  .btn .lbl { display: none; }
  .m-sys { display: flex !important; }
}
.m-sys { display: none; flex-wrap: wrap; justify-content: center; gap: 6px; }
@media (max-width: 420px) { .caps { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}
</style>

<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg style="color:#fff"><use href="#i-wave"/></svg></div>
      <div><b>readflow</b><small>业务系统只读 Agent</small></div>
    </div>
    <nav class="nav" aria-label="主导航">
      <button type="button" data-view="desk" aria-current="page"><svg><use href="#i-chat"/></svg>会话</button>
      <button type="button" data-view="graph"><svg><use href="#i-graph"/></svg>系统图谱</button>
      <button type="button" data-view="guard"><svg><use href="#i-shield"/></svg>只读护栏</button>
    </nav>
    <div>
      <h6>已接入系统</h6>
      <div class="sys-list" id="sys-list"></div>
      <button type="button" class="btn-ghost" style="margin-top:8px" data-act="import"><svg><use href="#i-import"/></svg>导入系统图谱</button>
    </div>
    <div class="side-foot" id="side-foot" aria-live="polite">
      <div class="live"><i class="dot"></i><span>正在连接服务…</span></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="logo m-brand"><svg style="color:#fff"><use href="#i-wave"/></svg></div>
      <div class="grow">
        <h1 id="view-title">会话</h1>
        <p id="view-sub">说一句话，Agent 按图谱去系统里取数；可以连续追问。</p>
      </div>
      <span class="pill" id="top-status"><i class="dot"></i>连接中</span>
      <button type="button" class="btn" id="btn-new" title="新会话"><svg><use href="#i-new"/></svg><span class="lbl">新会话</span></button>
    </header>

    <section class="view active" id="view-desk" aria-label="会话">
      <div class="thread" id="thread">
        <div class="thread-inner" id="thread-inner">
          <div class="hero" id="hero">
            <button type="button" class="orb" id="orb" aria-label="点击说话">
              <span class="ring"></span><span class="ring"></span><span class="ring"></span>
              <svg><use href="#i-mic"/></svg>
            </button>
            <div class="orb-hint" id="orb-hint">点一下，直接说</div>
            <h2>想从系统里<em>查点什么</em>？</h2>
            <p>我会按系统图谱找到数据所在的位置，只读取、不改动，然后把结果讲给你听。</p>
            <div class="m-sys" id="m-sys"></div>
            <div class="caps" id="caps"></div>
          </div>
        </div>
      </div>
      <div class="composer-wrap">
        <form class="composer" id="composer" autocomplete="off">
          <button type="button" class="mic" id="mic" aria-label="语音输入" aria-pressed="false"><svg><use href="#i-mic"/></svg></button>
          <textarea id="input" rows="1" placeholder="说一句，或输入你的问题…" aria-label="问题"></textarea>
          <button type="button" class="icon-btn" id="tts" aria-pressed="false" title="朗读回答" style="width:42px;height:42px;border-radius:50%"><svg style="width:18px;height:18px"><use href="#i-speaker"/></svg></button>
          <button type="submit" class="send" id="send" aria-label="发送" disabled><svg><use href="#i-send"/></svg></button>
        </form>
        <div class="composer-note">
          <span><svg><use href="#i-lock"/></svg>全程只读</span>
          <span>Enter 发送 · Shift+Enter 换行</span>
        </div>
      </div>
    </section>

    <section class="view" id="view-graph" aria-label="系统图谱">
      <div class="page">
        <div class="toolbar">
          <div class="legend" id="legend"></div>
          <span class="grow"></span>
          <button type="button" class="btn" data-act="export"><svg><use href="#i-export"/></svg><span class="lbl">导出</span></button>
          <button type="button" class="btn primary" data-act="import"><svg><use href="#i-import"/></svg>导入图谱</button>
        </div>
        <div class="graph-card">
          <div class="graph-scroll" id="graph-scroll"><div class="stage" id="stage"></div></div>
          <div class="zoom">
            <button type="button" class="icon-btn" data-zoom="-1" aria-label="缩小"><svg><use href="#i-minus"/></svg></button>
            <button type="button" class="icon-btn" data-zoom="0" aria-label="适应宽度"><svg><use href="#i-fit"/></svg></button>
            <button type="button" class="icon-btn" data-zoom="1" aria-label="放大"><svg><use href="#i-plus"/></svg></button>
          </div>
          <aside class="inspector" id="inspector" aria-live="polite"></aside>
        </div>
      </div>
    </section>

    <section class="view" id="view-guard" aria-label="只读护栏">
      <div class="page"><div class="grid" id="guard"></div></div>
    </section>

    <nav class="tabbar" aria-label="主导航">
      <button type="button" data-view="desk" aria-current="page"><svg><use href="#i-chat"/></svg>会话</button>
      <button type="button" data-view="graph"><svg><use href="#i-graph"/></svg>图谱</button>
      <button type="button" data-view="guard"><svg><use href="#i-shield"/></svg>护栏</button>
    </nav>
  </main>
</div>

<div class="modal" id="import-modal" hidden role="dialog" aria-modal="true" aria-labelledby="import-title">
  <div class="sheet">
    <h3 id="import-title">导入系统图谱</h3>
    <p>把探索阶段产出的标准图谱 JSON 拖进来或粘贴进来。校验通过后加载到本机运行层，会替换当前图谱（建议先导出备份）。</p>
    <label class="drop" id="drop">
      <svg style="width:22px;height:22px;color:var(--brand)"><use href="#i-import"/></svg>
      <span>拖入 <code>graph.json</code>，或 <u>选择文件</u></span>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </label>
    <textarea id="import-text" spellcheck="false" placeholder='{"version": 1, "nodes": [...], "edges": [...]}' aria-label="图谱 JSON"></textarea>
    <div id="import-check"></div>
    <footer>
      <button type="button" class="btn" data-act="load-current">载入当前图谱</button>
      <span style="flex:1"></span>
      <button type="button" class="btn" data-act="close-import">取消</button>
      <button type="button" class="btn primary" id="import-save" disabled>加载到运行层</button>
    </footer>
  </div>
</div>

<div class="modal" id="auth-modal" hidden role="dialog" aria-modal="true" aria-labelledby="auth-title">
  <div class="sheet" style="width:min(400px,100%)">
    <h3 id="auth-title">需要人工验证</h3>
    <p id="auth-hint">Agent 登录该系统时遇到验证码，请帮它看一眼。</p>
    <div style="display:flex;gap:10px;align-items:center">
      <img id="auth-img" alt="验证码" style="height:44px;min-width:120px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2)">
      <button type="button" class="btn" data-act="auth-refresh">换一张</button>
    </div>
    <input id="auth-code" inputmode="latin" autocomplete="off" aria-label="验证码" placeholder="输入验证码" style="width:100%;margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;outline:0;font-size:16px;letter-spacing:3px">
    <div id="auth-msg"></div>
    <footer>
      <button type="button" class="btn" data-act="close-auth">取消</button>
      <button type="button" class="btn primary" data-act="auth-submit">提交</button>
    </footer>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<script>
(() => {
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

// 所有动态内容都走 textContent / DOM 节点，不拼 HTML 字符串
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value == null || value === false) continue;
    if (key === 'class') el.className = value;
    else if (key === 'text') el.textContent = value;
    else if (key === 'style') el.style.cssText = value;
    else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
    else el.setAttribute(key, value === true ? '' : value);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function icon(name, style) {
  const svg = document.createElementNS(SVGNS, 'svg');
  const use = document.createElementNS(SVGNS, 'use');
  use.setAttribute('href', '#i-' + name);
  svg.setAttribute('aria-hidden', 'true');
  if (style) svg.style.cssText = style;
  svg.append(use);
  return svg;
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = (value) => typeof value !== 'number' ? String(value)
  : Number.isInteger(value) ? value.toLocaleString('zh-CN')
  : value.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const shortTime = (value) => value ? String(value).replace('T', ' ').slice(0, 16) : '';
const pick = (obj, path) => String(path).split('.').reduce((cur, key) => (cur == null ? cur : cur[key]), obj);

function toast(text, kind) {
  const el = h('div', { class: 'toast ' + (kind || ''), text });
  $('#toasts').append(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260); }, 3600);
}

async function api(path, options) {
  let res;
  try {
    res = await fetch(path, options);
  } catch (err) {
    throw new Error('连不上本机的 readflow 服务，请确认它还在运行。');
  }
  let data = null;
  try { data = await res.json(); } catch (err) { /* 非 JSON */ }
  if (!data) throw new Error('服务返回了无法解析的内容（HTTP ' + res.status + '）。');
  return data;
}
const post = (path, body) => api(path, {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify(body || {}),
});

const S = {
  graph: null,
  nodes: new Map(),
  executable: null,     // 运行层能执行的意图
  state: {},            // 多轮会话状态，每轮回传
  busy: false,
  listening: false,
  tts: localStorage.getItem('readflow.tts') === '1',
  status: null,
  systems: [],
  zoom: 0,              // 0 = 适应宽度
  selected: null,
  voiceSid: null,
  srBroken: false,
  authSystem: null,
};

const TYPES = {
  app: { label: '系统', color: '#4f46e5' },
  module: { label: '模块', color: '#7c3aed' },
  page: { label: '页面', color: '#0ea5e9' },
  api: { label: '接口', color: '#06b6d4' },
  provider: { label: '数据源', color: '#10b981' },
  entity: { label: '实体', color: '#f59e0b' },
  capability: { label: '能力', color: '#ec4899' },
};
const typeOf = (type) => TYPES[type] || { label: type || '节点', color: '#94a3b8' };
const KINDS = { cache: '本地缓存', api: '接口直连', page: '页面读取', live: '实时读取' };
const kindOf = (node) => (node && (node.kind || node.type)) || '';
const AUTH = { image_captcha: '图片验证码', sms: '短信验证', form: '账号密码', slider: '滑块验证' };

/* ---------- 视图切换 ---------- */
const VIEWS = {
  desk: ['会话', '说一句话，Agent 按图谱去系统里取数；可以连续追问。'],
  graph: ['系统图谱', '探索阶段产出的标准图谱：系统 → 页面 / 接口 → 实体 → 能力。点节点看细节。'],
  guard: ['只读护栏', '运行层只读取、不写入。这里列出的都是图谱和服务的真实状态。'],
};
function setView(name) {
  for (const [key] of Object.entries(VIEWS)) $('#view-' + key).classList.toggle('active', key === name);
  $$('[data-view]').forEach((btn) => {
    if (btn.dataset.view === name) btn.setAttribute('aria-current', 'page');
    else btn.removeAttribute('aria-current');
  });
  $('#view-title').textContent = VIEWS[name][0];
  $('#view-sub').textContent = VIEWS[name][1];
  $('#btn-new').hidden = name !== 'desk';
  if (name === 'graph') renderGraph();
  if (name === 'guard') renderGuard();
}

/* ---------- 服务状态与系统列表（都是真实接口，不写死） ---------- */
async function refreshStatus() {
  const foot = $('#side-foot');
  const top = $('#top-status');
  try {
    const st = await api('/desk/api/status');
    if (!st.ok) throw new Error(st.error || '状态异常');
    S.status = st;
    const mode = st.mode === 'live' ? '实时模式' : '缓存模式';
    const total = st.counts ? Object.values(st.counts).reduce((a, b) => a + (Number(b) || 0), 0)
      : (st.live ? st.live.rows : null);
    const lines = [h('div', { class: 'live' }, h('i', { class: 'dot ok' }), h('span', { text: '服务在线 · ' + mode }))];
    if (total != null) lines.push(h('div', { class: 'num', text: '本机已有 ' + fmt(total) + ' 条记录' }));
    lines.push(h('div', { text: st.data_as_of ? '数据截至 ' + shortTime(st.data_as_of) : '尚无同步时间' }));
    if (st.live && st.live.error) lines.push(h('div', { style: 'color:var(--err)', text: st.live.error }));
    foot.replaceChildren(...lines);
    top.className = 'pill ok';
    top.replaceChildren(h('i', { class: 'dot ok' }), mode);
  } catch (err) {
    S.status = null;
    foot.replaceChildren(
      h('div', { class: 'live' }, h('i', { class: 'dot err' }), h('span', { text: '服务不可达' })),
      h('div', { text: err.message }),
    );
    top.className = 'pill err';
    top.replaceChildren(h('i', { class: 'dot err' }), '离线');
  }
}

function systemPill(sys) {
  if (sys.status === 'online') return h('span', { class: 'pill ok', text: '在线' + (sys.rows ? ' · ' + fmt(sys.rows) + ' 条' : '') });
  if (sys.status === 'needs_auth') {
    return h('button', { type: 'button', class: 'pill warn', onclick: () => openAuth(sys), title: sys.error || '' }, '需要验证');
  }
  if (sys.status === 'cache') return h('span', { class: 'pill', text: '本地缓存' });
  if (sys.status === 'graph_only') return h('span', { class: 'pill', text: '仅图谱' });
  return h('span', { class: 'pill', text: '未接入登录' });
}
function hostOf(url) {
  try { return new URL(url).host; } catch (err) { return url || ''; }
}
function allSystems() {
  const list = S.systems.slice();
  const known = new Set(list.map((sys) => sys.base_url).filter(Boolean));
  // 图谱里声明、但本机还没有登录描述的系统也要列出来
  for (const node of S.nodes.values()) {
    if (node.type !== 'app' || known.has(node.base_url)) continue;
    list.push({ id: node.id, label: node.label || node.id, base_url: node.base_url, status: 'graph_only' });
  }
  return list;
}
function renderSystems() {
  const list = allSystems();
  const cards = list.map((sys) => h('div', { class: 'sys' },
    h('div', { class: 'sys-top' },
      h('div', { class: 'sys-ico', text: (sys.label || '?').trim().slice(0, 1) }),
      h('div', { style: 'min-width:0' },
        h('div', { class: 'sys-name', text: sys.label }),
        h('div', { class: 'sys-host', text: hostOf(sys.base_url) }))),
    h('div', { class: 'sys-meta' },
      systemPill(sys),
      sys.auth_kind && AUTH[sys.auth_kind] ? h('span', { class: 'pill', text: AUTH[sys.auth_kind] }) : null)));
  $('#sys-list').replaceChildren(...(cards.length ? cards : [h('div', { class: 'sys-host', style: 'padding:4px 8px', text: '还没有接入系统，先导入一张图谱。' })]));
  $('#m-sys').replaceChildren(...list.map((sys) => h('span', { class: 'pill brand', text: sys.label })));
}
async function refreshSystems() {
  try {
    const data = await api('/desk/api/systems');
    S.systems = data.ok ? data.systems || [] : [];
  } catch (err) {
    S.systems = [];
  }
  renderSystems();
}

/* ---------- 图谱数据 ---------- */
async function loadGraph() {
  try {
    const data = await api('/desk/api/graph');
    if (!data.ok) throw new Error(data.error || '图谱加载失败');
    S.graph = data.graph || { nodes: [], edges: [] };
    S.executable = Array.isArray(data.executable_intents) ? new Set(data.executable_intents) : null;
  } catch (err) {
    S.graph = { nodes: [], edges: [] };
    toast(err.message, 'err');
  }
  S.nodes = new Map((S.graph.nodes || []).map((node) => [node.id, node]));
  S.selected = null;
  renderCaps();
  renderSystems();
  if ($('#view-graph').classList.contains('active')) renderGraph();
  if ($('#view-guard').classList.contains('active')) renderGuard();
}
const capabilities = () => [...S.nodes.values()].filter((node) => node.type === 'capability');
const canRun = (cap) => !S.executable || S.executable.has(cap.intent);

function renderCaps() {
  const caps = capabilities().filter(canRun).slice(0, 6);
  $('#caps').replaceChildren(...caps.map((cap, index) => {
    const example = (cap.examples && cap.examples[0]) || ('查一下' + (cap.label || cap.intent));
    return h('button', {
      type: 'button', class: 'cap', style: 'animation-delay:' + (80 + index * 60) + 'ms',
      onclick: () => ask(example),
    }, h('span', { text: cap.label || cap.intent }), h('b', { text: '“' + example + '”' }));
  }));
}

/* ---------- 会话 ---------- */
const thread = $('#thread');
const inner = $('#thread-inner');
const hero = $('#hero');
const input = $('#input');
// 回答是逐步长出来的（打字、表格、追问），这段时间里一直贴着底部
let pinUntil = 0;
function scrollDown() {
  const running = pinUntil > performance.now();
  pinUntil = performance.now() + 1300;
  if (running) return;
  (function frame() {
    thread.scrollTop = thread.scrollHeight;
    if (performance.now() < pinUntil) requestAnimationFrame(frame);
  })();
}
thread.addEventListener('wheel', () => { pinUntil = 0; }, { passive: true });
thread.addEventListener('touchmove', () => { pinUntil = 0; }, { passive: true });

function addUser(text) {
  inner.append(h('div', { class: 'msg user' }, h('div', { class: 'bubble', text })));
  scrollDown();
}
function addPending(label) {
  const avatar = h('div', { class: 'avatar busy', 'aria-hidden': 'true' });
  const card = h('div', { class: 'card' },
    h('div', { class: 'thinking-row' },
      h('span', { class: 'dots' }, h('i'), h('i'), h('i')),
      h('span', { text: label || '正在按图谱规划取数路径…' })));
  const msg = h('div', { class: 'msg agent' }, avatar, card);
  inner.append(msg);
  scrollDown();
  return { msg, card, avatar };
}
function clearChips() { $$('.chips', inner).forEach((el) => el.remove()); }
function addChips(items, label) {
  const list = (items || []).filter(Boolean).slice(0, 4);
  if (!list.length) return;
  inner.append(h('div', { class: 'chips' },
    h('small', { text: label || '接着问' }),
    list.map((text) => h('button', { type: 'button', class: 'chip', text, onclick: () => ask(text) }))));
  scrollDown();
}

function typeInto(el, text) {
  if (reduceMotion || text.length < 4) { el.textContent = text; return; }
  const total = Math.min(900, 180 + text.length * 9);
  const start = performance.now();
  (function frame(now) {
    const n = Math.min(text.length, Math.ceil(((now - start) / total) * text.length));
    el.textContent = text.slice(0, n);
    if (n < text.length) requestAnimationFrame(frame);
  })(start);
}
function countUp(el, value) {
  if (reduceMotion) { el.textContent = fmt(value); return; }
  const start = performance.now();
  const isInt = Number.isInteger(value);
  (function frame(now) {
    const t = Math.min(1, (now - start) / 750);
    const eased = 1 - Math.pow(1 - t, 3);
    const cur = value * eased;
    el.textContent = fmt(t === 1 ? value : isInt ? Math.round(cur) : Math.round(cur * 100) / 100);
    if (t < 1) requestAnimationFrame(frame);
  })(start);
}

function conditionText(plan, data) {
  const parts = [];
  if (data && data.range_label) parts.push(data.range_label);
  const timeKeys = new Set(['start', 'end', 'month', 'days']);
  for (const [key, bind] of Object.entries(plan.bindings || {})) {
    if (data && data.range_label && timeKeys.has(key)) continue;
    parts.push(String(bind.value));
  }
  return parts.length ? parts.join(' · ') : '不限条件';
}
function buildTrace(plan, data) {
  const steps = [
    ['听懂', plan.label || plan.intent],
    ['条件', conditionText(plan, data)],
    ['取数路径', (plan.provider && plan.provider.label) || '—'],
    [plan.read_only ? '只读校验' : '注意', plan.read_only ? '只读取，不写入' : '该能力未声明只读', 'safe'],
    ['结果', '已作答'],
  ];
  const row = h('div', { class: 'trace', role: 'list', 'aria-label': '执行路径' });
  const els = [];
  steps.forEach(([small, big, cls], index) => {
    if (index) { const link = h('span', { class: 'link' }); row.append(link); els.push(link); }
    const step = h('div', { class: 'step ' + (cls || ''), role: 'listitem' },
      h('i', null, icon('check')), h('div', null, h('small', { text: small }), h('b', { text: big, title: big })));
    row.append(step);
    els.push(step);
  });
  els.forEach((el, index) => setTimeout(() => el.classList.add('on'), reduceMotion ? 0 : 90 + index * 95));
  return row;
}

function buildKpis(plan, data) {
  let metrics = (plan && plan.metrics) || [];
  if (!metrics.length && data && typeof data === 'object') {
    // 图谱没声明指标时：把顶层数字原样摆出来
    metrics = Object.keys(data).filter((key) => typeof data[key] === 'number').slice(0, 4).map((key) => ({ key, label: key }));
  }
  const tiles = [];
  for (const metric of metrics) {
    const value = pick(data, metric.key);
    if (typeof value !== 'number') continue;
    const number = h('span', { class: 'num' });
    const b = h('b', null, number, metric.unit ? h('span', { class: 'unit', text: metric.unit }) : null);
    tiles.push(h('div', { class: 'kpi' + (metric.accent ? ' accent' : '') }, h('small', { text: metric.label || metric.key }), b));
    countUp(number, value);
  }
  return tiles.length ? h('div', { class: 'kpis' }, tiles) : null;
}

function buildBars(groups) {
  if (!Array.isArray(groups) || groups.length < 2 || typeof groups[0] !== 'object') return null;
  const keys = Object.keys(groups[0]);
  const labelKey = keys.find((key) => typeof groups[0][key] === 'string');
  const valueKey = ['total', 'amount', 'value', 'sum'].find((key) => typeof groups[0][key] === 'number')
    || keys.find((key) => typeof groups[0][key] === 'number');
  if (!labelKey || !valueKey) return null;
  const max = Math.max(...groups.map((g) => Math.abs(Number(g[valueKey]) || 0)), 1e-9);
  const rows = groups.slice(0, 8).map((g) => {
    const fill = h('div', { class: 'fill' });
    const pct = Math.max(2, (Math.abs(Number(g[valueKey]) || 0) / max) * 100);
    setTimeout(() => { fill.style.width = pct + '%'; }, 120);
    return h('div', { class: 'bar' },
      h('label', { text: g[labelKey], title: g[labelKey] }),
      h('div', { class: 'track' }, fill),
      h('output', { class: 'num', text: fmt(Number(g[valueKey]) || 0) + (typeof g.n === 'number' ? ' · ' + g.n + ' 条' : '') }));
  });
  return h('div', { class: 'bars' }, rows);
}

const HIDDEN_COLS = new Set(['source_file', 'dataset', 'imported_at', 'dedup_key']);
function buildTable(rows, plan) {
  if (!Array.isArray(rows) || !rows.length || typeof rows[0] !== 'object') return null;
  const entity = plan && plan.entity ? S.nodes.get(plan.entity.id) : null;
  const labels = new Map(((entity && entity.fields) || []).map((f) => [f.name, f.label || f.name]));
  const cols = Object.keys(rows[0]).filter((key) =>
    !HIDDEN_COLS.has(key) && rows.some((row) => row[key] != null && row[key] !== '' && typeof row[key] !== 'boolean' && typeof row[key] !== 'object'));
  if (!cols.length) return null;
  // 图谱声明过的字段排前面
  cols.sort((a, b) => (labels.has(b) ? 1 : 0) - (labels.has(a) ? 1 : 0));
  const numeric = new Set(cols.filter((key) => rows.every((row) => row[key] == null || typeof row[key] === 'number')));
  const makeRow = (row) => h('tr', null, cols.map((key) => h('td', {
    class: numeric.has(key) ? 'r num' : '',
    text: row[key] == null || row[key] === '' ? '—' : numeric.has(key) ? fmt(row[key]) : String(row[key]),
  })));
  const FIRST = 6;
  const body = h('tbody', null, rows.slice(0, FIRST).map(makeRow));
  const table = h('table', null,
    h('thead', null, h('tr', null, cols.map((key) => h('th', { class: numeric.has(key) ? 'r' : '', text: labels.get(key) || key })))),
    body);
  const wrap = h('div', { class: 'table-wrap' }, table);
  if (rows.length <= FIRST) return [wrap];
  const more = h('button', { type: 'button', class: 'more', text: '展开全部 ' + rows.length + ' 行' });
  more.addEventListener('click', () => { body.append(...rows.slice(FIRST).map(makeRow)); more.remove(); });
  return [wrap, more];
}

function buildDetail(plan) {
  const box = h('div', { class: 'detail', hidden: true });
  if (Array.isArray(plan.steps) && plan.steps.length) {
    box.append(h('b', { text: '执行步骤' }), h('ol', null, plan.steps.map((step) => h('li', { text: step }))));
  }
  const fallbacks = plan.fallbacks || [];
  box.append(h('div', { class: 'fb' },
    h('span', { text: fallbacks.length ? '取不到时依次改走：' : '没有声明备用路径。' }),
    fallbacks.map((item) => h('span', {
      class: 'pill ' + (item.available ? 'ok' : ''),
      title: item.reason || '',
      text: (item.label || item.id) + ' · ' + (KINDS[item.kind] || item.kind || '') + (item.available ? '' : '（未就绪）'),
    }))));
  return box;
}

function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  // 明细太长时只念开头几句
  let say = text;
  if (say.length > 160) {
    const cut = say.slice(0, 160);
    const stop = Math.max(cut.lastIndexOf('。'), cut.lastIndexOf('；'));
    say = stop > 40 ? cut.slice(0, stop + 1) : cut;
  }
  const utter = new SpeechSynthesisUtterance(say);
  utter.lang = 'zh-CN';
  utter.rate = 1.05;
  speechSynthesis.speak(utter);
}

function renderAnswer(pending, data, opts) {
  const { card, avatar } = pending;
  avatar.classList.remove('busy');
  // 反问/澄清时没有真正取数，不展示执行路径和数字
  const plan = data.clarify ? null : data.plan || null;
  const payload = data.clarify ? null : data.data || null;
  const reply = data.reply || '';
  const kids = [];
  if (plan) kids.push(buildTrace(plan, payload));

  const body = h('div', { class: 'card-body' });
  const p = h('p', { class: 'reply' });
  body.append(p);
  const kpis = plan ? buildKpis(plan, payload) : null;
  const bars = payload ? buildBars(payload.groups) : null;
  const table = payload ? buildTable(payload.rows, plan) : null;
  if ((bars || table) && reply.length > 110) {
    p.classList.add('clamp');
    const more = h('button', { type: 'button', class: 'more', text: '展开全文' });
    more.addEventListener('click', () => { p.classList.remove('clamp'); more.remove(); });
    body.append(more);
  }
  if (kpis) body.append(kpis);
  if (bars) body.append(bars);
  if (table) body.append(...table);
  kids.push(body);

  const foot = h('div', { class: 'card-foot' });
  if (plan) {
    const detail = buildDetail(plan);
    kids.push(detail);
    if (plan.provider) foot.append(h('span', { class: 'pill brand' }, icon('db'), KINDS[plan.provider.kind] || plan.provider.kind || '数据源'));
    if (plan.read_only) foot.append(h('span', { class: 'pill ok' }, icon('lock'), '只读'));
    if (data.data_as_of) foot.append(h('span', { class: 'pill', text: '数据截至 ' + shortTime(data.data_as_of) }));
    foot.append(h('span', { class: 'grow' }));
    const toggle = h('button', { type: 'button', class: 'icon-btn', title: '执行细节', 'aria-label': '执行细节', 'aria-pressed': 'false' }, icon('route'));
    toggle.addEventListener('click', () => {
      detail.hidden = !detail.hidden;
      toggle.setAttribute('aria-pressed', String(!detail.hidden));
    });
    foot.append(toggle);
    if (capabilities().some((cap) => cap.intent === plan.intent)) {
      foot.append(h('button', { type: 'button', class: 'icon-btn', title: '在图谱中查看这条路径', 'aria-label': '在图谱中查看这条路径', onclick: () => showInGraph(plan.intent) }, icon('graph')));
    }
  } else {
    foot.append(h('span', { class: 'grow' }));
  }
  foot.append(h('button', { type: 'button', class: 'icon-btn', title: '朗读', 'aria-label': '朗读', onclick: () => speak(reply) }, icon('speaker')));
  kids.push(foot);

  card.replaceChildren(...kids);
  typeInto(p, reply);
  addChips(data.followups, plan ? '接着问' : '可以这样问');
  if (S.tts || (opts && opts.voice)) speak(reply);
  scrollDown();
}

async function ask(text, opts) {
  text = String(text || '').trim();
  if (!text || S.busy) return;
  if (!$('#view-desk').classList.contains('active')) setView('desk');
  S.busy = true;
  hero.hidden = true;
  clearChips();
  input.value = '';
  autosize();
  addUser(text);
  const pending = addPending();
  setOrb('thinking');
  try {
    const data = await post('/desk/api/query', { text, state: S.state });
    if (!data.ok) throw new Error(data.error || '查询失败');
    if (data.state_patch) S.state = { ...S.state, ...data.state_patch };
    renderAnswer(pending, data, opts);
  } catch (err) {
    renderError(pending, err.message);
  } finally {
    S.busy = false;
    setOrb('idle');
    updateSend();
  }
}

/* ---------- 语音 ---------- */
const orb = $('#orb');
const mic = $('#mic');
function setOrb(mode, hint) {
  orb.classList.toggle('listening', mode === 'listening');
  orb.classList.toggle('thinking', mode === 'thinking');
  mic.classList.toggle('listening', mode === 'listening');
  mic.setAttribute('aria-pressed', String(mode === 'listening'));
  mic.replaceChildren(icon(mode === 'listening' ? 'stop' : 'mic'));
  $('#orb-hint').textContent = hint || (mode === 'thinking' ? '正在取数…' : '点一下，直接说');
  S.listening = mode === 'listening';
}
let recognition = null;
let recorder = null;

function startRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  let finalText = '';
  let fallback = false;
  rec.lang = 'zh-CN';
  rec.interimResults = true;
  rec.onresult = (event) => {
    let text = '';
    for (const result of event.results) text += result[0].transcript;
    input.value = text;
    autosize();
    updateSend();
    if (event.results[event.results.length - 1].isFinal) finalText = text;
  };
  rec.onerror = (event) => {
    if (event.error === 'not-allowed') toast('没有拿到麦克风权限。', 'err');
    // 浏览器自带识别连不上（内网 / 国内常见）时改用本机 VoiceLab 识别
    else if (['network', 'service-not-allowed', 'language-not-supported', 'audio-capture'].includes(event.error)) fallback = true;
  };
  rec.onend = () => {
    recognition = null;
    setOrb('idle');
    if (fallback) { S.srBroken = true; startRecorder(); return; }
    if (finalText.trim()) ask(finalText, { voice: true });
  };
  try {
    rec.start();
    recognition = rec;
    setOrb('listening', '在听，说完自动发送');
  } catch (err) {
    S.srBroken = true;
    startRecorder();
  }
}

async function startRecorder() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
    toast(window.isSecureContext ? '这个浏览器不支持录音，请直接输入文字。' : '浏览器只允许在 HTTPS 或 localhost 下使用麦克风，请直接输入文字。', 'err');
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    toast('没有拿到麦克风权限。', 'err');
    return;
  }
  const chunks = [];
  const rec = new MediaRecorder(stream);
  rec.ondataavailable = (event) => { if (event.data.size) chunks.push(event.data); };
  rec.onstop = () => {
    stream.getTracks().forEach((track) => track.stop());
    recorder = null;
    setOrb('idle');
    const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
    if (blob.size) sendAudio(blob);
  };
  rec.start();
  recorder = rec;
  setOrb('listening', '在听，再点一下结束');
}

async function sendAudio(blob) {
  hero.hidden = true;
  const pending = addPending('正在识别语音…');
  try {
    if (!S.voiceSid) {
      const session = await api('/desk/api/voice/session', { method: 'POST' });
      if (!session.ok || !session.session_id) throw new Error(session.error || '语音服务没有返回会话。');
      S.voiceSid = session.session_id;
    }
    const ext = /mp4|m4a|aac/.test(blob.type) ? 'm4a' : /ogg/.test(blob.type) ? 'ogg' : 'webm';
    const form = new FormData();
    form.append('audio', blob, 'turn.' + ext);
    const turn = await api('/desk/api/voice/turn?sid=' + encodeURIComponent(S.voiceSid), { method: 'POST', body: form });
    if (!turn.ok) throw new Error(turn.error || '语音识别失败。');
    if (!turn.heard) throw new Error('没听清，请再说一遍。');
    pending.msg.remove();
    // 识别出的文字走同一条查询链路，才有执行路径、表格和追问
    ask(turn.heard, { voice: true });
  } catch (err) {
    renderError(pending, err.message);
  }
}

function toggleVoice() {
  if (S.busy) return;
  if (recognition) { recognition.stop(); return; }
  if (recorder) { recorder.stop(); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR && window.isSecureContext && !S.srBroken) startRecognition();
  else startRecorder();
}
function closeVoiceSession() {
  if (!S.voiceSid) return;
  fetch('/desk/api/voice/session?sid=' + encodeURIComponent(S.voiceSid), { method: 'DELETE', keepalive: true }).catch(() => {});
  S.voiceSid = null;
}

/* ---------- 图谱视图：分层节点 + 连线 ---------- */
const NODE_W = 172, NODE_H = 50, GAP_X = 66, GAP_Y = 14, PAD_X = 28, PAD_TOP = 50, PAD_BOTTOM = 30;
const ORDER = ['app', 'module', 'page', 'api', 'provider', 'entity', 'capability'];
let layout = null;

function implicitEdges() {
  const out = [];
  for (const cap of capabilities()) {
    for (const id of cap.providers || []) if (S.nodes.has(id)) out.push({ from: cap.id, to: id, implicit: true });
    if (cap.entity && S.nodes.has(cap.entity)) out.push({ from: cap.id, to: cap.entity, implicit: true });
  }
  return out;
}
function computeLayout() {
  const nodes = [...S.nodes.values()];
  const types = [...new Set(nodes.map((node) => node.type))];
  const cols = ORDER.filter((type) => types.includes(type)).concat(types.filter((type) => !ORDER.includes(type)));
  const edges = (S.graph.edges || []).filter((e) => S.nodes.has(e.from) && S.nodes.has(e.to)).concat(implicitEdges());
  const near = new Map(nodes.map((node) => [node.id, new Set()]));
  for (const e of edges) { near.get(e.from).add(e.to); near.get(e.to).add(e.from); }
  const columns = cols.map((type) => nodes.filter((node) => node.type === type));
  const rank = new Map();
  columns.forEach((col) => col.forEach((node, index) => rank.set(node.id, index)));
  // 两趟重心排序，减少连线交叉
  const sweep = (list) => list.forEach((col) => {
    const score = (node) => {
      const others = [...near.get(node.id)].filter((id) => S.nodes.get(id).type !== node.type);
      return others.length ? others.reduce((sum, id) => sum + rank.get(id), 0) / others.length : rank.get(node.id);
    };
    col.map((node) => [score(node), node]).sort((a, b) => a[0] - b[0]).forEach(([, node], index) => {
      col[index] = node;
      rank.set(node.id, index);
    });
  });
  sweep(columns);
  sweep(columns.slice().reverse());
  const tallest = Math.max(1, ...columns.map((col) => col.length));
  const height = PAD_TOP + tallest * NODE_H + (tallest - 1) * GAP_Y + PAD_BOTTOM;
  const width = PAD_X * 2 + cols.length * NODE_W + Math.max(0, cols.length - 1) * GAP_X;
  const pos = new Map();
  columns.forEach((col, ci) => {
    const colH = col.length * NODE_H + (col.length - 1) * GAP_Y;
    const top = PAD_TOP + (height - PAD_TOP - PAD_BOTTOM - colH) / 2;
    col.forEach((node, ri) => pos.set(node.id, { x: PAD_X + ci * (NODE_W + GAP_X), y: top + ri * (NODE_H + GAP_Y), col: ci }));
  });
  return { cols, columns, edges, near, pos, width, height };
}
function edgePath(a, b) {
  if (a.col === b.col) {
    const x = a.x + NODE_W, bend = 34 + Math.abs(a.y - b.y) * 0.12;
    return `M${x},${a.y + NODE_H / 2} C${x + bend},${a.y + NODE_H / 2} ${x + bend},${b.y + NODE_H / 2} ${x},${b.y + NODE_H / 2}`;
  }
  const [l, r] = a.col < b.col ? [a, b] : [b, a];
  const x1 = l.x + NODE_W, y1 = l.y + NODE_H / 2, x2 = r.x, y2 = r.y + NODE_H / 2, mid = (x2 - x1) / 2;
  return `M${x1},${y1} C${x1 + mid},${y1} ${x2 - mid},${y2} ${x2},${y2}`;
}
function nodeSub(node) {
  if (node.type === 'capability') return node.intent || node.id;
  if (node.type === 'api') return [node.method, node.path].filter(Boolean).join(' ') || node.id;
  if (node.type === 'page') return node.route || node.id;
  if (node.type === 'app') return hostOf(node.base_url) || node.id;
  return node.id;
}
const nodeOff = (node) => node.available === false || (node.type === 'capability' && !canRun(node));

function renderGraph() {
  const stage = $('#stage');
  const counts = {};
  for (const node of S.nodes.values()) counts[node.type] = (counts[node.type] || 0) + 1;
  $('#legend').replaceChildren(...Object.entries(counts).map(([type, n]) =>
    h('span', { class: 'pill' }, h('i', { style: '--c:' + typeOf(type).color }), typeOf(type).label + ' ' + n)));
  if (!S.nodes.size) {
    layout = null;
    stage.style.cssText = '';
    stage.replaceChildren(h('div', { class: 'empty' }, '图谱是空的。点右上角「导入图谱」，把探索阶段产出的 JSON 加载进来。'));
    return;
  }
  layout = computeLayout();
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('width', layout.width);
  svg.setAttribute('height', layout.height);
  for (const edge of layout.edges) {
    const path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('d', edgePath(layout.pos.get(edge.from), layout.pos.get(edge.to)));
    path.setAttribute('class', 'edge' + (edge.implicit ? ' implicit' : ''));
    path.dataset.from = edge.from;
    path.dataset.to = edge.to;
    svg.append(path);
  }
  const kids = [svg];
  layout.cols.forEach((type, ci) => kids.push(h('div', {
    class: 'col-title', style: `left:${PAD_X + ci * (NODE_W + GAP_X)}px;width:${NODE_W}px`, text: typeOf(type).label,
  })));
  let order = 0;
  layout.columns.forEach((col) => col.forEach((node) => {
    const at = layout.pos.get(node.id);
    const el = h('button', {
      type: 'button', class: 'node' + (nodeOff(node) ? ' off' : ''), 'data-id': node.id,
      style: `left:${at.x}px;top:${at.y}px;width:${NODE_W}px;height:${NODE_H}px;--c:${typeOf(node.type).color};animation-delay:${Math.min(600, order++ * 22)}ms`,
      title: node.label || node.id,
    }, h('i'), h('div', null, h('b', { text: node.label || node.id }), h('small', { text: nodeSub(node) })));
    el.addEventListener('mouseenter', () => focusNode(node.id));
    el.addEventListener('mouseleave', () => focusNode(S.selected));
    el.addEventListener('focus', () => focusNode(node.id));
    el.addEventListener('click', () => selectNode(node.id));
    kids.push(el);
  }));
  stage.replaceChildren(...kids);
  stage.style.width = layout.width + 'px';
  stage.style.height = layout.height + 'px';
  applyZoom();
  focusNode(S.selected);
  if (S.selected) openInspector(S.selected); else closeInspector();
}
function applyZoom() {
  if (!layout) return;
  const stage = $('#stage');
  const avail = $('#graph-scroll').clientWidth;
  const fit = Math.max(0.45, Math.min(1, avail / layout.width));
  const z = S.zoom || fit;
  const w = layout.width * z, hgt = layout.height * z;
  stage.style.transform = `scale(${z})`;
  stage.style.margin = `0 ${w - layout.width}px ${hgt - layout.height}px ${Math.max(0, (avail - w) / 2)}px`;
}
function focusNode(id) {
  const stage = $('#stage');
  $$('.order', stage).forEach((el) => el.remove());
  $$('.hl', stage).forEach((el) => el.classList.remove('hl'));
  $$('.node.sel', stage).forEach((el) => el.classList.remove('sel'));
  const selectedEl = S.selected && stage.querySelector(`.node[data-id="${CSS.escape(S.selected)}"]`);
  if (selectedEl) selectedEl.classList.add('sel');
  if (!id || !layout || !S.nodes.has(id)) { stage.classList.remove('focus'); return; }
  stage.classList.add('focus');
  const keep = new Set([id, ...layout.near.get(id)]);
  $$('.node', stage).forEach((el) => el.classList.toggle('hl', keep.has(el.dataset.id)));
  $$('.edge', stage).forEach((el) => el.classList.toggle('hl', el.dataset.from === id || el.dataset.to === id));
  const node = S.nodes.get(id);
  if (node.type === 'capability') {
    // 标出取数的降级顺序
    (node.providers || []).forEach((pid, index) => {
      const el = stage.querySelector(`.node[data-id="${CSS.escape(pid)}"]`);
      if (el) el.append(h('span', { class: 'order', text: index + 1 }));
    });
  }
}
function selectNode(id) {
  S.selected = S.selected === id ? null : id;
  focusNode(S.selected);
  if (S.selected) openInspector(S.selected); else closeInspector();
}
function showInGraph(intent) {

  const fail = (message) => box.replaceChildren(h('div', { class: 'check err', text: message }));
  let data;
  try { data = JSON.parse(text); } catch (err) { return fail('不是合法的 JSON：' + err.message); }
  if (!data || typeof data !== 'object' || Array.isArray(data) || !Array.isArray(data.nodes)) return fail('图谱必须是对象，并且包含 nodes 数组。');
  const ids = new Set();
  for (const node of data.nodes) {
    if (!node || !node.id) return fail('有节点缺少 id。');
    if (ids.has(node.id)) return fail('节点 id 重复：' + node.id);
    ids.add(node.id);
  }
  for (const edge of data.edges || []) {
    for (const end of ['from', 'to']) if (!ids.has(edge[end])) return fail('连线引用了不存在的节点：' + edge[end]);
  }
  const counts = {};
  data.nodes.forEach((node) => { counts[node.type] = (counts[node.type] || 0) + 1; });
  const caps = data.nodes.filter((node) => node.type === 'capability');
  const warns = [];
  const noProvider = caps.filter((cap) => !(cap.providers || []).some((id) => ids.has(id)));
  if (noProvider.length) warns.push(noProvider.length + ' 个能力没有可用的数据来源：' + noProvider.map((cap) => cap.label || cap.id).join('、'));
  const notRunnable = S.executable ? caps.filter((cap) => !S.executable.has(cap.intent)) : [];
  if (notRunnable.length) warns.push(notRunnable.length + ' 个能力在当前运行层没有执行器，导入后只能展示、不能查询：' + notRunnable.map((cap) => cap.label || cap.id).join('、'));
  const writable = data.nodes.filter((node) => node.read_only === false);
  if (writable.length) warns.push(writable.length + ' 个节点声明为可写：' + writable.map((node) => node.label || node.id).join('、'));
  box.replaceChildren(
    h('div', { class: 'check ok' },
      h('b', { text: '结构校验通过：' + data.nodes.length + ' 个节点，' + (data.edges || []).length + ' 条连线' }),
      h('div', { class: 'tags' }, Object.entries(counts).map(([type, n]) => h('span', { class: 'pill', text: typeOf(type).label + ' ' + n })))),
    ...warns.map((text) => h('div', { class: 'check warn', text })));
  pendingGraph = data;
  save.disabled = false;
}
function openImport() {
  $('#import-modal').hidden = false;
  $('#import-text').value = '';
  checkGraph('');
  $('#import-text').focus();
}
async function saveImport() {
  if (!pendingGraph) return;
  const save = $('#import-save');
  save.disabled = true;
  try {
    const res = await post('/desk/api/graph/save', { graph: pendingGraph });
    if (!res.ok) throw new Error(res.error || '保存失败');
    $('#import-modal').hidden = true;
    toast('图谱已加载到运行层。', 'ok');
    await loadGraph();
  } catch (err) {
    toast(err.message, 'err');
    save.disabled = false;
  }
}
function readFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { $('#import-text').value = String(reader.result || ''); checkGraph($('#import-text').value); };
  reader.readAsText(file);
}
function exportGraph() {
  const blob = new Blob([JSON.stringify(S.graph || {}, null, 2)], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: 'graph.json' });
  document.body.append(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ---------- 人工验证（验证码接力） ---------- */
function showChallenge(data) {
  const msg = $('#auth-msg');
  msg.replaceChildren();
  if (data.already_solved) {
    $('#auth-modal').hidden = true;
    toast('已经登录，不需要验证。', 'ok');
    refreshSystems();
    return;
  }
  if (!data.ok) { msg.replaceChildren(h('div', { class: 'check err', text: data.error || '拿不到验证码。' })); return; }
  if (data.image && /^data:image\//.test(data.image)) $('#auth-img').src = data.image;
  if (data.hint) $('#auth-hint').textContent = data.hint;
}
async function openAuth(sys) {
  S.authSystem = sys.id;
  $('#auth-title').textContent = sys.label + ' 需要人工验证';
  $('#auth-hint').textContent = 'Agent 登录该系统时遇到验证码，请帮它看一眼。';
  $('#auth-img').removeAttribute('src');
  $('#auth-code').value = '';
  $('#auth-modal').hidden = false;
  try { showChallenge(await api('/desk/api/auth/challenge?system=' + encodeURIComponent(sys.id))); }
  catch (err) { showChallenge({ ok: false, error: err.message }); }
  $('#auth-code').focus();
}
async function authAction(kind) {
  try {
    if (kind === 'refresh') return showChallenge(await post('/desk/api/auth/refresh', { system: S.authSystem }));
    const res = await post('/desk/api/auth/submit', { system: S.authSystem, code: $('#auth-code').value.trim() });
    if (!res.ok) throw new Error(res.error || '验证失败');
    $('#auth-modal').hidden = true;
    toast('验证通过。', 'ok');
    refreshSystems();
    refreshStatus();
  } catch (err) {
    $('#auth-msg').replaceChildren(h('div', { class: 'check err', text: err.message }));
  }
}

/* ---------- 事件绑定 ---------- */
$$('[data-view]').forEach((btn) => btn.addEventListener('click', () => setView(btn.dataset.view)));
const ACTIONS = {
  import: openImport,
  export: exportGraph,
  'close-import': () => { $('#import-modal').hidden = true; },
  'load-current': () => { $('#import-text').value = JSON.stringify(S.graph || {}, null, 2); checkGraph($('#import-text').value); },
  'close-auth': () => { $('#auth-modal').hidden = true; },
  'auth-refresh': () => authAction('refresh'),
  'auth-submit': () => authAction('submit'),
};
$$('[data-act]').forEach((btn) => btn.addEventListener('click', ACTIONS[btn.dataset.act]));
$$('[data-zoom]').forEach((btn) => btn.addEventListener('click', () => {
  const dir = Number(btn.dataset.zoom);
  if (!dir) S.zoom = 0;
  else {
    const cur = S.zoom || Math.max(0.45, Math.min(1, $('#graph-scroll').clientWidth / (layout ? layout.width : 1)));
    S.zoom = Math.max(0.4, Math.min(1.6, cur + dir * 0.15));
  }
  applyZoom();
}));
$('#composer').addEventListener('submit', (event) => { event.preventDefault(); ask(input.value); });
input.addEventListener('input', () => { autosize(); updateSend(); });
input.addEventListener('keydown', (event) => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); ask(input.value); }
});
orb.addEventListener('click', toggleVoice);
mic.addEventListener('click', toggleVoice);
$('#btn-new').addEventListener('click', newSession);
const ttsBtn = $('#tts');
const syncTts = () => { ttsBtn.setAttribute('aria-pressed', String(S.tts)); ttsBtn.title = S.tts ? '朗读回答：开' : '朗读回答：关'; };
ttsBtn.addEventListener('click', () => {
  S.tts = !S.tts;
  localStorage.setItem('readflow.tts', S.tts ? '1' : '0');
  if (!S.tts && 'speechSynthesis' in window) speechSynthesis.cancel();
  syncTts();
});
syncTts();
$('#import-text').addEventListener('input', (event) => checkGraph(event.target.value));
$('#import-save').addEventListener('click', saveImport);
$('#file').addEventListener('change', (event) => readFile(event.target.files[0]));
const drop = $('#drop');
['dragenter', 'dragover'].forEach((name) => drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach((name) => drop.addEventListener(name, (event) => { event.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', (event) => readFile(event.dataTransfer.files[0]));
$('#auth-code').addEventListener('keydown', (event) => { if (event.key === 'Enter') authAction('submit'); });
$$('.modal').forEach((modal) => modal.addEventListener('click', (event) => { if (event.target === modal) modal.hidden = true; }));
document.addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  const open = $$('.modal').find((modal) => !modal.hidden);
  if (open) open.hidden = true;
  else if (S.selected) selectNode(S.selected);
});
window.addEventListener('resize', applyZoom);
window.addEventListener('pagehide', closeVoiceSession);

refreshStatus();
refreshSystems();
loadGraph();
setInterval(() => { if (!document.hidden) { refreshStatus(); refreshSystems(); } }, 30000);
})();
</script>
</body>
